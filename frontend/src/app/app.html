<app-navbar></app-navbar>

<main class="container mx-auto p-4 md:p-8">
  <router-outlet></router-outlet>
</main>

@if (toastService.isVisible()) {
  <div 
    class="fixed bottom-6 right-6 px-6 py-4 rounded-lg shadow-2xl border transition-all duration-300 z-50 animate-fade-in-up"
    [class.bg-red-900]="toastService.isError()"
    [class.border-red-500]="toastService.isError()"
    [class.text-red-200]="toastService.isError()"
    [class.bg-emerald-900]="!toastService.isError()"
    [class.border-emerald-500]="!toastService.isError()"
    [class.text-emerald-200]="!toastService.isError()"
  >
    <div class="flex items-center space-x-3">
      @if (toastService.isError()) {
        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      } @else {
        <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      }
      <span class="font-medium">{{ toastService.message() }}</span>
    </div>
  </div>
}
