<div class="max-w-md mx-auto mt-12 bg-slate-900 p-8 rounded-xl shadow-2xl border border-slate-800">
  
  <h2 class="text-3xl font-bold text-white mb-6 text-center">Accedi</h2>
  
  @if (errorMessage) {
    <div class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg mb-6 text-center text-sm font-medium">
      {{ errorMessage }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
    
    <div>
      <label for="username" class="block text-sm font-medium text-slate-400 mb-2">Username</label>
      <input 
        type="text" 
        id="username" 
        name="username" 
        [(ngModel)]="credentials.username" 
        required
        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-slate-300 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-200"
        placeholder="Il tuo nome utente"
      >
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-400 mb-2">Password</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        [(ngModel)]="credentials.password" 
        required
        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-slate-300 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-200"
        placeholder="La tua password"
      >
    </div>

    <button 
      type="submit" 
      [disabled]="isLoading || loginForm.invalid"
      class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ isLoading ? 'Accesso in corso...' : 'Entra nel gioco' }}
    </button>

  </form>

  <p class="mt-8 text-center text-slate-500 text-sm">
    Non hai ancora un account? 
    <a routerLink="/register" class="text-emerald-400 hover:text-emerald-300 font-medium transition duration-200">Registrati qui</a>
  </p>
  
</div>
