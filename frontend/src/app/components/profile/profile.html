<div class="max-w-2xl mx-auto mt-12 bg-slate-900 p-8 rounded-xl shadow-2xl border border-slate-800">
  
  <h2 class="text-3xl font-bold text-white mb-8 border-b border-slate-800 pb-4">
    Your <span class="text-emerald-500">Profile</span>
  </h2>

  @if (isLoading) {
    <div class="text-center py-10 text-slate-400">Loading profile...</div>
  } @else {
    <div class="flex flex-col md:flex-row items-center gap-8">
      
      <div class="flex-shrink-0">
        <div class="w-40 h-40 rounded-full border-4 border-slate-800 overflow-hidden bg-slate-950 flex items-center justify-center">
          @if (previewUrl) {
            <img [src]="previewUrl" alt="Avatar" class="w-full h-full object-cover">
          } @else {
            <svg class="w-20 h-20 text-slate-700" fill="currentColor" viewBox="0 0 24 24">
              <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          }
        </div>
      </div>

      <div class="flex-grow w-full">
        <h3 class="text-2xl font-bold text-slate-200 mb-2">Agent: {{ user?.username }}</h3>
        <p class="text-slate-400 mb-6">Customize your public appearance.</p>

        <div class="space-y-4">
          <label class="block text-sm font-medium text-emerald-400">Upload New Avatar</label>
          <input 
            type="file" 
            accept="image/*" 
            (change)="onFileSelected($event)"
            class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer"
          >
          
          <button 
            (click)="saveAvatar()"
            [disabled]="isSaving || !previewUrl"
            class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {{ isSaving ? 'Saving...' : 'Save Avatar' }}
          </button>
        </div>
      </div>

    </div>
  }
</div>
